# Terbitkan app baca (app/) + dokumen (output/) ke GitHub Pages setiap ada push ke main.
name: Terbitkan app baca

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Susun indeks dokumen
        run: python scripts/buat_indeks.py
      - name: Rakit situs
        run: |
          mkdir _site
          cp -r app/. _site/
          cp -r output _site/output
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
